name: Build All Platforms

on:
  push:
    branches: [ "main" ]

# Grant GitHub Actions permission to create a Release
permissions:
  contents: write 

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # 1. Compile for EVERY combination using a simple loop
      - name: Build for ALL Platforms and Architectures
        run: |
          mkdir -p dist
          
          # List every OS/Arch combination you want here:
          TARGETS=(
            "windows/amd64" "windows/386" "windows/arm64"
            "linux/amd64" "linux/386" "linux/arm" "linux/arm64" "linux/riscv64" "linux/mips64"
            "darwin/amd64" "darwin/arm64"
            "freebsd/amd64" "freebsd/arm64"
            "openbsd/amd64" "openbsd/arm64"
          )
          
          for TARGET in "${TARGETS[@]}"; do
            # Split the target into GOOS and GOARCH
            GOOS=${TARGET%/*}
            GOARCH=${TARGET#*/}
            BINARY_NAME="picoclaw-${GOOS}-${GOARCH}"
            
            # Add .exe extension if building for Windows
            if [ "$GOOS" = "windows" ]; then
              BINARY_NAME="${BINARY_NAME}.exe"
            fi
            
            echo "Building $BINARY_NAME ..."
            
            # Compile with CGO disabled for maximum portability
            GOOS=$GOOS GOARCH=$GOARCH CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/$BINARY_NAME .
          done

      # 2. Auto-grab version (Date + Git Commit Hash)
      - name: Generate Version Name
        run: |
          DATE=$(date +'%Y%m%d')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "TAG_NAME=dev-${DATE}-${SHORT_SHA}" >> $GITHUB_ENV

      # 3. Create the Release and upload all the built files
      - name: Publish Auto-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Auto-Build ${{ env.TAG_NAME }}
          body: |
            🚀 Comprehensive cross-platform build from `main`.
            - **Commit:** `${{ github.sha }}`
            
            *Automatically built for Windows, macOS, Linux, FreeBSD, and OpenBSD across x86, ARM, and RISC-V architectures.*
          draft: false
          prerelease: true 
          files: dist/* # Uploads everything we put in the 'dist' folder

name: build

on:
  push:
    branches: [ "main" ]

# 1. MUST HAVE: Grant permission to create a release
permissions:
  contents: write 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4 

      - name: Setup Go
        uses: actions/setup-go@v5 
        with:
          go-version-file: go.mod

      - name: Build
        run: make build-all

      # 2. Automatically generate a unique version tag (e.g., dev-20260228-a1b2c3d)
      - name: Generate Version Tag
        run: |
          DATE=$(date +'%Y%m%d')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "TAG_NAME=dev-${DATE}-${SHORT_SHA}" >> $GITHUB_ENV

      # 3. Create the release and upload the binaries
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Auto-Build ${{ env.TAG_NAME }}
          body: "Automated build triggered by push to main. Commit: ${{ github.sha }}"
          prerelease: true # Keeps it marked as a pre-release so it doesn't confuse standard users
          fail_on_unmatched_files: false
          # Uploads output binaries. Adjust these paths if PicoClaw outputs to a specific folder!
          files: |
            build/*
            bin/*
            picoclaw-*
            *.exe
